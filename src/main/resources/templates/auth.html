<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Pandit General Store</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'sans-serif'] },
    colors: {
      kirana: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},
      saffron: {500:'#f97316',600:'#ea580c',700:'#c2410c'}
    }
  }}
};
</script>
<link rel="stylesheet" th:href="@{/style/app.css}">

</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen antialiased">
<div th:replace="~{fragments/header::header(auth)}"></div>

<main class="flex-grow max-w-md w-full mx-auto px-4 py-8">
<div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-xl space-y-6">
  <div class="flex border-b border-slate-200">
    <button type="button" onclick="switchAuthTab('login')" id="auth-tab-login" class="w-1/2 py-2.5 text-xs font-extrabold text-slate-800 border-b-2 border-kirana-700">Sign In</button>
    <button type="button" onclick="switchAuthTab('register')" id="auth-tab-register" class="w-1/2 py-2.5 text-xs font-bold text-slate-400 border-b-2 border-transparent">New Account</button>
  </div>
  <form id="form-login" th:action="@{/auth/login}" method="post" class="space-y-4">
    <input name="username" required placeholder="Mobile Number or Email" class="w-full text-xs p-3 border rounded-xl">
    <input name="password" type="password" required placeholder="Password" class="w-full text-xs p-3 border rounded-xl">
    <button class="w-full bg-kirana-800 hover:bg-kirana-900 text-white font-extrabold text-xs py-3.5 rounded-xl">Login to Pandit General Store</button>
  </form>
  <form id="form-register" th:action="@{/auth/register}" method="post" class="space-y-4 hidden">
    <input name="name" required placeholder="Full Name" class="w-full text-xs p-3 border rounded-xl">
    <input name="mobile" required placeholder="10-digit phone number" class="w-full text-xs p-3 border rounded-xl">
    <input name="locality" required placeholder="Locality / Landmark" class="w-full text-xs p-3 border rounded-xl">
    <input name="password" type="password" required placeholder="Create Password" class="w-full text-xs p-3 border rounded-xl">
    <button class="w-full bg-saffron-600 hover:bg-saffron-700 text-white font-extrabold text-xs py-3.5 rounded-xl">Create Customer Account</button>
  </form>
</div>
</main>

<div th:replace="~{fragments/header::footer}"></div>
<script th:src="@{/script/app.js}"></script>
</body></html>
