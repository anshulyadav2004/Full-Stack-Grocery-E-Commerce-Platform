<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Pandit General Store</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'sans-serif'] },
    colors: {
      kirana: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},
      saffron: {500:'#f97316',600:'#ea580c',700:'#c2410c'}
    }
  }}
};
</script>
<link rel="stylesheet" th:href="@{/style/app.css}">

</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen antialiased">
<div th:replace="~{fragments/header::header(checkout)}"></div>

<main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
<h1 class="text-2xl font-extrabold text-slate-900 mb-6">Checkout</h1>
<form th:action="@{/checkout/place-order}" method="post" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  <div class="lg:col-span-2 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-5">
    <h2 class="font-extrabold">Delivery Details</h2>
    <input name="name" required placeholder="Full Name" class="w-full text-xs p-3 border rounded-xl">
    <input name="phone" required placeholder="Mobile Number" class="w-full text-xs p-3 border rounded-xl">
    <textarea name="address" required placeholder="Complete Delivery Address" rows="4" class="w-full text-xs p-3 border rounded-xl"></textarea>
    <select name="paymentMethod" class="w-full text-xs p-3 border rounded-xl"><option value="cod">Cash on Delivery (COD)</option><option value="upi">UPI / Pay on Delivery</option></select>
  </div>
  <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm h-fit space-y-4">
    <h2 class="font-extrabold">Order Total</h2>
    <div class="flex justify-between text-xs"><span>Subtotal</span><b th:text="'₹' + ${subtotal}">₹0</b></div>
    <div class="flex justify-between"><span class="font-bold">Total</span><b th:text="'₹' + ${total}" class="text-xl text-kirana-800">₹0</b></div>
    <button class="w-full bg-kirana-800 hover:bg-kirana-900 text-white font-extrabold text-xs py-3.5 rounded-xl">Place Order Now <i class="fa-solid fa-circle-check ml-1"></i></button>
  </div>
</form>
</main>

<div th:replace="~{fragments/footer::footer}"></div>
<script th:src="@{/script/app.js}"></script>
</body></html>
